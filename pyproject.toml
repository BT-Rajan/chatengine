[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "db-chat-ai"
version = "0.3.0"
description = "Standalone natural-language chat library over a database, local files, and web pages."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "SQLAlchemy>=2.0",
    "PyMySQL>=1.1",
]

[project.optional-dependencies]
server = ["Flask>=3.0"]
csv = ["pandas>=2.0"]
redis = ["redis>=5.0"]

[tool.setuptools]
packages = [
    "db_chat_ai",
    "db_chat_ai.interfaces",
    "db_chat_ai.factories",
    "db_chat_ai.plugins",
    "db_chat_ai.sources",
]
